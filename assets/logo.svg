<svg width="620" height="139" viewBox="0 0 669.273 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UniAVC</title>
  <desc id="desc">The UniAVC wordmark in the project's blue-violet-green gradient, beside a mark pairing an audio waveform with a video frame and play control.</desc>

  <defs>
    <linearGradient id="uniavc" x1="20" y1="23" x2="669.273" y2="141.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset="0.48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#45d789"/>
    </linearGradient>
    <!-- The wordmark's own span, so the letters run the full blue -> violet -> green like
         the project page's `.uniavc-mark`. objectBoundingBox, not userSpaceOnUse: the text
         path carries transform="translate(264 114.06)", and a userSpaceOnUse gradient is
         resolved in that element's own coordinate system, so parent-space coordinates
         land in the wrong place. Bounding-box units are transform-independent. -->
    <linearGradient id="uniavc-word" x1="0" y1="0" x2="1" y2="0.17">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset="0.48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#45d789"/>
    </linearGradient>
  </defs>

  <!-- Mark: audio waveform on the left, a video frame with a play control on the right. -->
  <g stroke="url(#uniavc)" stroke-width="14" stroke-linecap="round">
    <line x1="27"  y1="55" x2="27"  y2="95"/>
    <line x1="53"  y1="37" x2="53"  y2="113"/>
    <line x1="79"  y1="23" x2="79"  y2="127"/>
    <line x1="105" y1="43" x2="105" y2="107"/>
  </g>
  <rect x="131" y="33" width="84" height="84" rx="18" stroke="url(#uniavc)" stroke-width="14" fill="none"/>
  <path d="M155 57 L186 75 L155 93 Z" fill="url(#uniavc)"/>

  <!-- Wordmark, converted to outlines from Inter Black so it renders identically
       everywhere. Do not replace this with <text>: a viewer without the font would
       fall back to something else, and pinning the width with textLength is what
       distorted the C in the first place. -->
